const stick=$('stick'),knob=$('knob');let active=null;function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=48,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/max;joy.y=dy/max}
stick.addEventListener('pointerdown',e=>{active=e.pointerId;stick.setPointerCapture(active);stickMove(e)});stick.addEventListener('pointermove',e=>{if(active===e.pointerId)stickMove(e)});function resetStick(){active=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
init();
</script>
