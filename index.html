 for(let i=0;i<CFG.cars;i++){let g=createCar(i+1);traffic.push({g,axis:i%2?'x':'z',lane:i%2?(-168+(i%5)*70):(-210+(i%7)*65),offset:(i%3-1)*2.2,speed:7+(i%5)*2.2,phase:i*37,dir:i%4<2?1:-1})}
 // NPC walkers
 for(let i=0;i<CFG.npc;i++){const g=new THREE.Group(),shirt=mat([0x3d566e,0xa65a42,0x536b4d,0xd1c4a9][i%4]);add(new THREE.CapsuleGeometry(.23,.5,4,8),shirt,0,1.05,0,g);add(new THREE.SphereGeometry(.17,12,10),skin,0,1.75,0,g);const legs=[];for(const s of [-1,1])legs.push(add(new THREE.CapsuleGeometry(.09,.42,4,7),trousers,s*.11,.46,0,g));scene.add(g);npcs.push({g,legs,x:-100+(i%4)*7,z:-170+i*19,phase:i*.7,axis:i%2?'x':'z'})}
}
function blocked(x,z){if(Math.abs(x)>CFG.map/2-2||Math.abs(z)>CFG.map/2-2)return true;if(Math.abs(z)<55 && !([-118,8,132].some(bx=>Math.abs(x-bx)<10)))return true;for(const b of colliders)if(x+.65>b.a&&x-.65<b.b&&z+.65>b.c&&z-.65<b.d)return true;return false}
function movePlayer(dt){const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(f.z,0,-f.x);const m=f.clone().multiplyScalar(-joyY).add(r.multiplyScalar(joyX));if(keys.KeyW||keys.ArrowUp)m.add(f);if(keys.KeyS||keys.ArrowDown)m.sub(f);if(keys.KeyD||keys.ArrowRight)m.add(r);if(keys.KeyA||keys.ArrowLeft)m.sub(r);if(m.lengthSq()>1)m.normalize();const speed=run?CFG.sprint:CFG.walk;if(m.lengthSq()>.001){const step=m.multiplyScalar(speed*dt),nx=player.position.x+step.x,nz=player.position.z+step.z;if(!blocked(nx,player.position.z))player.position.x=nx;if(!blocked(player.position.x,nz))player.position.z=nz;player.rotation.y=Math.atan2(step.x,step.z);setHumanAnimation(run?'run':'walk');const walk=Math.sin(elapsed*10)*(run?1.25:1);for(const [i,o] of characterLimbs.entries())o.rotation.x=walk*(i%2?-.8:.8)}else{setHumanAnimation('idle');for(const o of characterLimbs)o.rotation.x*=.8;}
 if(player.position.y>0||jumpV>0){jumpV-=20*dt;player.position.y=Math.max(0,player.position.y+jumpV*dt);if(player.position.y===0){jumpV=0;onGround=true}}
}
function updateCar(dt){const throttle=(keys.KeyW||joyY<-.2)?1:((keys.KeyS||joyY>.2)?-1:0);const steer=(keys.KeyA||joyX<-.2)?1:((keys.KeyD||joyX>.2)?-1:0);carSpeed+=throttle*18*dt;carSpeed*=Math.pow(.985,dt*60);carSpeed=THREE.MathUtils.clamp(carSpeed,-10,CFG.drive);car.rotation.y+=steer*dt*(.9+Math.abs(carSpeed)*.045)*Math.sign(carSpeed||1);const nx=car.position.x+Math.sin(car.rotation.y)*carSpeed*dt,nz=car.position.z+Math.cos(car.rotation.y)*carSpeed*dt;if(!blocked(nx,nz)){car.position.x=nx;car.position.z=nz}else carSpeed*=.25;player.position.copy(car.position);player.position.y=.05;player.rotation.y=car.rotation.y;$('#speed').textContent=Math.round(Math.abs(carSpeed)*3.6)+' km/h'}
function cameraUpdate(dt){const target=driving?car.position:player.position;const dist=driving?10:7.5,height=driving?4.1:3.2;const desired=new THREE.Vector3(target.x-Math.sin(yaw)*dist,target.y+height+Math.sin(pitch)*4,target.z-Math.cos(yaw)*dist);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+(driving?1.2:1.35),target.z)}
function setHumanAnimation(kind){if(!humanMixer)return;const key=Object.keys(humanActions).find(k=>k.includes(kind));if(!key)return;const next=humanActions[key];if(humanCurrent!==next){next.reset().fadeIn(.18).play();if(humanCurrent)humanCurrent.fadeOut(.18);humanCurrent=next}}
function updateWorld(dt){elapsed+=dt;if(humanMixer)humanMixer.update(dt);
 // Spin visible wheel hubs on all traffic and the player's vehicle
 for(const vehicle of [car,...traffic.map(v=>v.g)])for(const wheel of (vehicle?.userData.wheels||[]))wheel.rotation.x+=dt*(vehicle===car?carSpeed:13);
 const water=scene.children.find(o=>o.userData.water);if(water){const a=water.geometry.attributes.position,base=water.geometry.userData.base;for(let i=0;i<a.count;i++){const x=base[i*3],z=base[i*3+2];a.array[i*3+1]=Math.sin(x*.035+elapsed*.9)*.22+Math.cos(z*.13+elapsed*1.2)*.11;}a.needsUpdate=true;water.geometry.computeVertexNormals();}
 for(const v of traffic){const t=(elapsed*v.speed+v.phase)%620-310;if(v.axis==='z'){v.g.position.set(v.lane+v.offset,.08,t*v.dir);v.g.rotation.y=v.dir>0?Math.PI:0}else{v.g.position.set(t*v.dir,.08,v.lane+v.offset);v.g.rotation.y=v.dir>0?Math.PI/2:-Math.PI/2}}
 for(const n of npcs){n.phase+=dt*.9;const d=Math.sin(n.phase)*7;n.g.position.set(n.x+(n.axis==='x'?d:0),0,n.z+(n.axis==='z'?d:0));n.legs[0].rotation.x=Math.sin(n.phase*6)*.5;n.legs[1].rotation.x=-Math.sin(n.phase*6)*.5}
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(driving)updateCar(dt);else movePlayer(dt);updateWorld(dt);cameraUpdate(dt);renderer.render(scene,camera);if(!driving)$('#speed').textContent=run?'奔跑':'步行'}
function action(){if(!player)return;if(!driving){if(player.position.distanceTo(car.position)<5){driving=true;player.visible=false;carSpeed=0;status.textContent='驾驶中 · W/S 或摇杆前后 · A/D 转向';$('#action').textContent='下车'}}else{driving=false;player.visible=true;player.position.set(car.position.x+3,0,car.position.z);carSpeed=0;status.textContent='上海 · 黄浦江沿岸自由探索';$('#action').textContent='上车'}}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight)}
$('#play').onclick=()=>$('#start').style.display='none';$('#action').onclick=action;$('#jump').onclick=()=>{if(!driving&&onGround){jumpV=8;onGround=false}};$('#run').onpointerdown=()=>run=true;$('#run').onpointerup=$('#run').onpointercancel=()=>run=false;$('#reset').onclick=()=>{if(driving){driving=false;player.visible=true;$('#action').textContent='上车'}player.position.set(-92,0,82);car.position.set(-92,.08,78.5);car.rotation.y=Math.PI/2;carSpeed=0;yaw=Math.PI/2;pitch=.18};
const stick=$('#stick'),knob=$('#knob');function stickMove(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=38;if(len>max){dx*=max/len;dy*=max/len}joyX=dx/max;joyY=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function release(){stickId=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
game.addEventListener('pointerdown',e=>{if(e.target!==renderer.domElement)return;drag=true;lastX=e.clientX;lastY=e.clientY});game.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.006;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lastY)*.004,-.18,.72);lastX=e.clientX;lastY=e.clientY});game.addEventListener('pointerup',()=>drag=false);game.addEventListener('pointercancel',()=>drag=false);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')action();if(e.code==='Space'&&!driving&&onGround){jumpV=8;onGround=false}});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));window.addEventListener('resize',resize);
try{makeShanghai();animate()}catch(e){status.textContent='场景启动失败：'+e.message;console.error(e)}
</script></body></html>
