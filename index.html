<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>都市狂飙：自由之城</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}
#game{position:fixed;inset:0;z-index:0}canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between}.tag{padding:9px 12px;border-radius:12px;background:#07111dcc;border:1px solid #ffffff30;font-size:12px}
#stick{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff90;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:50%;background:#dbeafe99;border:2px solid white;pointer-events:none}
#buttons{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
button{height:62px;border:1px solid #ffffff90;border-radius:18px;background:#0b1c30eF;color:white;font-weight:700;font-size:12px;touch-action:manipulation}
#status{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:#07111dcc;padding:8px 12px;border-radius:10px;font-size:12px;white-space:nowrap;max-width:90%;overflow:hidden}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse,#263e52,#070c12);padding:24px}
.panel{width:min(430px,100%);padding:26px;border:1px solid #ffffff30;border-radius:24px;background:#081421ed}
h1{font-size:32px;margin:0 0 8px}.panel p{color:#b7c6d6;font-size:14px;line-height:1.6}.panel button{width:100%;height:54px;background:#e87924;border:0;font-size:16px}
</style></head><body>
<div id="game"></div>
<div id="ui"><div class="top"><div class="tag">自由之城 · 3D 测试版</div><div class="tag" id="speed">速度 0</div></div><div id="status">等待进入城市</div><div id="stick"><div id="knob"></div></div><div id="buttons"><button id="jump">跳跃</button><button id="run">冲刺</button><button id="view">视角复位</button><button id="reset">重置位置</button></div></div>
<div id="start"><div class="panel"><div style="color:#fbbf24;letter-spacing:3px;font-size:11px">OPEN WORLD · MOBILE TEST</div><h1>都市狂飙<br>自由之城</h1><p>这次先验证 iPhone 的 3D 画面和触屏控制。看到地面、建筑和人物移动后，再逐步恢复完整城市内容。</p><button id="play">进入城市</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const status=document.querySelector('#status'),game=document.querySelector('#game');
let renderer,scene,camera,player,velocity=0,jumpV=0,run=false,yaw=0,pitch=.35,active=null,joyX=0,joyY=0,lastX=0,lastY=0;
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
function boot(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x87b8d0);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
 renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power',failIfMajorPerformanceCaveat:false});
 renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.touchAction='none';game.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x596b55,2));
 const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-20,40,20);scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x61765e));ground.rotation.x=-Math.PI/2;ground.position.y=-.06;scene.add(ground);
 const road=new THREE.Mesh(new THREE.BoxGeometry(12,.05,160),mat(0x30363c));road.position.set(0,0,-15);scene.add(road);
 for(let i=-3;i<=3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(7,8+(i%3)*4,7),mat(i%2?0x9babb0:0xc4b8a5));b.position.set(i*13,4+(i%3)*2,-22-Math.abs(i%2)*12);scene.add(b);}
 player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,4,8),mat(0x263c56));body.position.y=1;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),mat(0xc38b69));head.position.y=1.78;player.add(head);scene.add(player);player.position.set(0,0,8);
 status.textContent='3D 场景已启动 · 左侧摇杆移动 · 拖动画面转动视角';
 animate();
}
function resize(){if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta());const forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),right=new THREE.Vector3(forward.z,0,-forward.x);const move=forward.multiplyScalar(-joyY).add(right.multiplyScalar(joyX));if(move.lengthSq()>1)move.normalize();const speed=run?12:6;player.position.addScaledVector(move,speed*dt);if(move.lengthSq()>.001)player.rotation.y=Math.atan2(move.x,move.z);if(player.position.y>0||jumpV>0){jumpV-=18*dt;player.position.y=Math.max(0,player.position.y+jumpV*dt);if(player.position.y===0)jumpV=0;}const target=player.position;const h=9*Math.cos(pitch);const desired=new THREE.Vector3(target.x-Math.sin(yaw)*h,target.y+3+9*Math.sin(pitch),target.z-Math.cos(yaw)*h);camera.position.lerp(desired,.12);camera.lookAt(target.x,target.y+1,target.z);renderer.render(scene,camera);document.querySelector('#speed').textContent='速度 '+Math.round(move.length()*speed*3.6)+' km/h'}
const clock=new THREE.Clock();
document.querySelector('#play').onclick=()=>document.querySelector('#start').style.display='none';
document.querySelector('#jump').onclick=()=>{if(player&&player.position.y===0)jumpV=8};
document.querySelector('#run').onpointerdown=()=>run=true;document.querySelector('#run').onpointerup=document.querySelector('#run').onpointercancel=()=>run=false;
document.querySelector('#reset').onclick=()=>{player.position.set(0,0,8);yaw=0;pitch=.35};
document.querySelector('#view').onclick=()=>{yaw=0;pitch=.35};
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,L=Math.hypot(dx,dy),m=43;if(L>m){dx*=m/L;dy*=m/L}joyX=dx/m;joyY=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
stick.addEventListener('pointerdown',e=>{active=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(active===e.pointerId)moveStick(e)});
function release(){active=null;joyX=joyY=0;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
let dragging=false;rendererPointer();
function rendererPointer(){game.addEventListener('pointerdown',e=>{if(e.target!==renderer?.domElement)return;dragging=true;lastX=e.clientX;lastY=e.clientY;});game.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.008;pitch=THREE.MathUtils.clamp(pitch-(e.clientY-lastY)*.005,.05,.85);lastX=e.clientX;lastY=e.clientY});game.addEventListener('pointerup',()=>dragging=false);game.addEventListener('pointercancel',()=>dragging=false)}
window.addEventListener('resize',resize);window.addEventListener('error',e=>{status.textContent='错误：'+e.message});window.addEventListener('unhandledrejection',e=>{status.textContent='模块错误：'+String(e.reason)});
try{boot()}catch(e){status.textContent='3D 启动失败：'+e.message}
</script></body></html>
